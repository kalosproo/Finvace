<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Finvace logo</title>
  <desc id="desc">Gold portfolio bar mark on a black background.</desc>
  <rect width="512" height="512" fill="#000000"/>
  <defs>
    <linearGradient id="gold" x1="54" y1="178" x2="458" y2="366" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1b34d"/>
      <stop offset="0.5" stop-color="#efa437"/>
      <stop offset="1" stop-color="#d98b25"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f1b34d" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#softGlow)" stroke="url(#gold)" stroke-width="22" stroke-linecap="round">
    <line x1="65" y1="264" x2="447" y2="264"/>
    <line x1="162" y1="205" x2="162" y2="324"/>
    <line x1="258" y1="184" x2="258" y2="357"/>
    <line x1="358" y1="205" x2="358" y2="324"/>
  </g>
</svg>
